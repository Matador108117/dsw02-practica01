spring:
  application:
    name: empleados
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/empleados_db}
    username: ${DB_USER:empleados}
    password: ${DB_PASSWORD:empleados}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

app:
  security:
    username: ${APP_USER:admin}
    password: ${APP_PASSWORD:admin123}

logging:
  level:
    root: INFO
    com.dsw02.empleados: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
