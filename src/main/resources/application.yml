spring:
  application:
    name: empleados
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/empleados_db}
    username: ${DB_USER:empleados}
    password: ${DB_PASSWORD:empleados}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

app:
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@empresa.com}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
    only-once: true
  bootstrap-test-user:
    nombre: ${APP_TEST_USER_NAME:prueba2}
    email: ${APP_TEST_USER_EMAIL:emailprueba@gmail.com}
    password: ${APP_TEST_USER_PASSWORD:contra123}
    rol: ${APP_TEST_USER_ROLE:USER}
  api-version:
    release-v2-utc: ${API_RELEASE_V2_UTC:2026-03-14T00:00:00Z}
    sunset-v1-utc: ${API_SUNSET_V1_UTC:2026-06-12T00:00:00Z}

logging:
  level:
    root: INFO
    com.dsw02.empleados: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
