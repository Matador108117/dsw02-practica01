name: 04-docker

on:
  workflow_run:
    workflows:
      - "03-Cypress"
    types:
      - completed

env:
  IMAGE_NAME_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
  IMAGE_NAME_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'
      }}

    permissions:
      contents: read

    steps:
      - name: Debug event
        run: |
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Event: ${{ github.event.workflow_run.event }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"

      - name: Validate merge develop -> master
        run: |
          PR_DATA='${{ toJson(github.event.workflow_run.pull_requests) }}'

          echo "$PR_DATA"

          BASE=$(echo "$PR_DATA" | jq -r '.[0].base.ref')
          HEAD=$(echo "$PR_DATA" | jq -r '.[0].head.ref')
          MERGED=$(echo "$PR_DATA" | jq -r '.[0].merged')

          echo "BASE=$BASE"
          echo "HEAD=$HEAD"
          echo "MERGED=$MERGED"

          if [[ "$BASE" != "master" ]]; then
            echo "Not targeting master"
            exit 1
          fi

          if [[ "$HEAD" != "develop" ]]; then
            echo "Not coming from develop"
            exit 1
          fi

          if [[ "$MERGED" != "true" ]]; then
            echo "PR was not merged"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: mvn -B -ntp verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}