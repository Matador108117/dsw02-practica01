name: 03-docker
on:
    pull_request:
        branches:
            - main
        types:
            - closed

env:
    IMAGE_NAME_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
    IMAGE_NAME_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}-frontend

jobs:
    build-and-push:
        if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
                uses: actions/checkout@v4

            - name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push backend image
                uses: docker/build-push-action@v5
                with:
                    context: .
                    file: ./Dockerfile
                    push: true
                    tags: ${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}

            - name: Build and push frontend image
                uses: docker/build-push-action@v5
                with:
                    context: ./frontend
                    file: ./frontend/Dockerfile
                    push: true
                    tags: ${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}